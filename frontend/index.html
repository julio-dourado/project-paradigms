<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dominó</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script src="build/main.js"></script>
  <script>
    // O endereço do backend pode vir no endereço da página: index.html?api=http://localhost:9000
    // Sem ele, servido por http(s) (backend local ou o site no ar), usa o próprio endereço da página.
    // Aberto direto do disco, o Main.elm cai no padrão http://localhost:8000.
    var api = new URLSearchParams(location.search).get("api")
      || (location.protocol.indexOf("http") === 0 ? location.origin : null);
    Elm.Main.init({ node: document.getElementById("app"), flags: api });
  </script>
</body>
</html>
